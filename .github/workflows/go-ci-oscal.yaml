name: Go CI (oscal module)
permissions:
  contents: read
on:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'examples/**'
      - '.golangci.yaml'
      - '.github/workflows/go-ci-oscal.yaml'
  pull_request:
    branches:
      - main
    paths:
      - '**.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'examples/**'
      - '.golangci.yaml'
      - '.github/workflows/go-ci-oscal.yaml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oscal
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27.x'

    - name: Vet
      run: go vet ./...

    - name: Run tests
      run: go test -v -covermode=count ./...

    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
        working-directory: oscal
        args: --config=${{ github.workspace }}/.golangci.yaml --timeout 3m
